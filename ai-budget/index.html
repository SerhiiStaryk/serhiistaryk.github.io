<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI budget</title>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div
      id="app"
      style="
        max-width: 440px;
        margin: 0 auto;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1a1a1a;
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          margin-bottom: 16px;
        "
      >
        <h1 style="font-size: 18px; font-weight: 600; margin: 0">AI budget</h1>
        <span
          id="saveIndicator"
          style="font-size: 12px; color: #999; transition: opacity 0.3s"
          >saved</span
        >
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 16px; align-items: end">
        <div style="width: 96px">
          <label
            for="unit"
            style="
              font-size: 13px;
              color: #666;
              display: block;
              margin-bottom: 4px;
            "
            >Unit</label
          >
          <div style="position: relative">
            <select
              id="unit"
              style="
                width: 100%;
                height: 36px;
                padding: 0 28px 0 8px;
                border: 1px solid #d9d9d4;
                border-radius: 8px;
                font-size: 14px;
                box-sizing: border-box;
                background: white;
                appearance: none;
                cursor: pointer;
              "
            >
              <option value="tokens">Tokens</option>
              <option value="usd">$</option>
            </select>
            <span
              aria-hidden="true"
              style="
                position: absolute;
                top: 13px;
                right: 10px;
                width: 7px;
                height: 7px;
                border-right: 1px solid #666;
                border-bottom: 1px solid #666;
                transform: rotate(45deg);
                pointer-events: none;
              "
            ></span>
          </div>
        </div>
        <div style="flex: 1">
          <label
            for="monthly"
            style="
              font-size: 13px;
              color: #666;
              display: block;
              margin-bottom: 4px;
            "
            >Budget per month</label
          >
          <input
            type="number"
            id="monthly"
            value="1000000"
            min="0"
            step="1000"
            style="
              width: 100%;
              height: 36px;
              padding: 0 10px;
              border: 1px solid #d9d9d4;
              border-radius: 8px;
              font-size: 14px;
              box-sizing: border-box;
            "
          />
        </div>
        <div style="flex: 1">
          <label
            for="used"
            style="
              font-size: 13px;
              color: #666;
              display: block;
              margin-bottom: 4px;
            "
            >Used so far</label
          >
          <input
            type="number"
            id="used"
            value="0"
            min="0"
            step="1000"
            style="
              width: 100%;
              height: 36px;
              padding: 0 10px;
              border: 1px solid #d9d9d4;
              border-radius: 8px;
              font-size: 14px;
              box-sizing: border-box;
            "
          />
        </div>
      </div>

      <div style="margin-bottom: 16px">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
          "
        >
          <button
            id="prev"
            aria-label="Previous month"
            style="
              width: 32px;
              height: 32px;
              border: 1px solid #d9d9d4;
              border-radius: 8px;
              background: white;
              cursor: pointer;
              font-size: 14px;
            "
          >
            ‹
          </button>
          <span
            id="monthLabel"
            style="font-size: 14px; font-weight: 500"
          ></span>
          <button
            id="next"
            aria-label="Next month"
            style="
              width: 32px;
              height: 32px;
              border: 1px solid #d9d9d4;
              border-radius: 8px;
              background: white;
              cursor: pointer;
              font-size: 14px;
            "
          >
            ›
          </button>
        </div>
        <div
          id="weekdayRow"
          style="
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 4px;
          "
        ></div>
        <div
          id="grid"
          style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px"
        ></div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
          "
        >
          <span style="font-size: 12px; color: #999"
            >Click days to mark as working days</span
          >
          <button
            id="resetBtn"
            style="
              font-size: 12px;
              padding: 4px 10px;
              border: 1px solid #d9d9d4;
              border-radius: 6px;
              background: white;
              cursor: pointer;
            "
          >
            Reset to weekdays
          </button>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 12px">
        <div
          style="
            flex: 1;
            background: #f5f4f0;
            border-radius: 8px;
            padding: 12px 14px;
          "
        >
          <p style="font-size: 12px; color: #999; margin: 0 0 2px">
            <span id="dailyLimitLabel">Tokens</span> per day (limit)
          </p>
          <p
            id="dailyLimit"
            style="font-size: 15px; font-weight: 600; margin: 0"
          >
            50,000
          </p>
        </div>
        <div
          style="
            flex: 1;
            background: #f5f4f0;
            border-radius: 8px;
            padding: 12px 14px;
          "
        >
          <p style="font-size: 12px; color: #999; margin: 0 0 2px">
            Expected <span id="expectedLabel">Tokens</span> used by today
          </p>
          <p id="expected" style="font-size: 15px; font-weight: 600; margin: 0">
            0
          </p>
        </div>
      </div>

      <div
        id="diffCard"
        style="
          border-radius: 8px;
          padding: 14px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 12px;
        "
      >
        <div>
          <p style="font-size: 12px; margin: 0 0 2px">
            Actual vs. planned pace
          </p>
          <p
            id="diffValue"
            style="font-size: 18px; font-weight: 600; margin: 0"
          >
            0
          </p>
        </div>
        <span
          id="statusBadge"
          style="
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            font-weight: 500;
          "
        ></span>
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 12px">
        <div
          style="
            flex: 1;
            background: #f5f4f0;
            border-radius: 8px;
            padding: 12px 14px;
          "
        >
          <p style="font-size: 12px; color: #999; margin: 0 0 2px">
            <span id="remainingLabel">Tokens</span> left
          </p>
          <p
            id="remaining"
            style="font-size: 15px; font-weight: 600; margin: 0"
          >
            1,000,000
          </p>
        </div>
        <div
          style="
            flex: 1;
            background: #f5f4f0;
            border-radius: 8px;
            padding: 12px 14px;
          "
        >
          <p style="font-size: 12px; color: #999; margin: 0 0 2px">
            Working days left
          </p>
          <p id="daysLeft" style="font-size: 15px; font-weight: 600; margin: 0">
            20
          </p>
        </div>
      </div>

      <div
        style="
          background: #f5f4f0;
          border-radius: 8px;
          padding: 16px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <span style="font-size: 13px; color: #666"
          ><span id="resultLabel">Tokens</span> per remaining working day</span
        >
        <span id="result" style="font-size: 24px; font-weight: 600"
          >50,000</span
        >
      </div>
    </div>
  </body>
</html>
